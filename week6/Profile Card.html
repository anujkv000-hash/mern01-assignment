<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>6.2 - Profile Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #edf2f8;
        }

        .top-bar {
            padding: 15px;
            background: #14233f;
            color: white;
            text-align: center;
        }

        .profile-card {
            width: 290px;
            margin: 25px auto;
            padding: 20px;
            border: 2px solid #315efb;
            border-radius: 17px;
            background: white;
            text-align: center;
        }

        .avatar {
            width: 94px;
            height: 94px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #3157e8;
            color: white;
            display: grid;
            place-items: center;
            font-size: 38px;
        }

        .bio-box {
            height: 90px;
            padding: 10px;
            border: 1px solid #ccd3df;
            overflow: auto;
            text-align: left;
        }
    </style>
</head>

<body>
    <header class="top-bar">My Profile Page</header>

    <main>
        <section class="profile-card">
            <div class="avatar">A</div>
            <h1>Anuj Kumar Verma</h1>
            <p>Web Developer in Making</p>
            <div class="bio-box">
                Hi! I am anuj kumar verma. I started coding this year. I like making small websites,
                drawing and listening to music. My goal is to build my own app.
            </div>
        </section>
    </main>
</body>

</html>
