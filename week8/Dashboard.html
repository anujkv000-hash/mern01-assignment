<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Final Dashboard</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f4f9;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 140px 1fr 100px;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 20px;
            width: 100%;
            max-width: 1050px;
        }

        .header {
            grid-area: head;
            background-color: #111e38;
            color: white;
            border-radius: 8px;
            padding: 25px;
            font-size: 26px;
            font-weight: bold;
        }

        .sidebar {
            grid-area: side;
            background-color: #dbe4ff;
            border-radius: 8px;
            padding: 25px 20px;
        }

        .sidebar h3 {
            color: #111e38;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .sidebar ul {
            list-style-type: disc;
            padding-left: 20px;
        }

        .sidebar ul li {
            margin-bottom: 12px;
            color: #222;
            font-size: 16px;
        }

        .main-content {
            grid-area: main;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            grid-auto-rows: min-content;
            gap: 15px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .card i {
            font-size: 32px;
            width: 40px;
            text-align: center;
        }

        .icon-user {
            color: #1e74fd;
        }

        .icon-sales {
            color: #fdb022;
        }

        .icon-orders {
            color: #c69265;
        }

        .icon-rating {
            color: #fec84b;
        }

        .icon-messages {
            color: #667085;
        }

        .icon-done {
            color: #47cd89;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .card-value {
            font-weight: bold;
            font-size: 16px;
            color: #111e38;
        }

        .card-label {
            font-size: 14px;
            color: #444;
        }

        .footer {
            grid-area: foot;
            background-color: #111e38;
            color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <div class="header">My Dashboard</div>
        <div class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </div>
        <div class="main-content">
            <div class="card"><i class="fa-solid fa-user icon-user"></i>
                <div class="card-info"><span class="card-value">120</span><span class="card-label">Users</span></div>
            </div>
            <div class="card"><i class="fa-solid fa-circle-dollar-to-slot icon-sales"></i>
                <div class="card-info"><span class="card-value">Rs 45k</span><span class="card-label">Sales</span></div>
            </div>
            <div class="card"><i class="fa-solid fa-box icon-orders"></i>
                <div class="card-info"><span class="card-value">36</span><span class="card-label">Orders</span></div>
            </div>
            <div class="card"><i class="fa-solid fa-star icon-rating"></i>
                <div class="card-info"><span class="card-value">4.8</span><span class="card-label">Rating</span></div>
            </div>
            <div class="card"><i class="fa-solid fa-comment-dots icon-messages"></i>
                <div class="card-info"><span class="card-value">18</span><span class="card-label">Messages</span></div>
            </div>
            <div class="card"><i class="fa-solid fa-square-check icon-done"></i>
                <div class="card-info"><span class="card-value">92%</span><span class="card-label">Done</span></div>
            </div>
        </div>
        <div class="footer">Made with CSS Grid</div>
    </div>
</body>

</html>
