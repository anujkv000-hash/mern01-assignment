<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f4f9;
            padding: 20px;
        }
        
        .dashboard-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
        }

        .header {
            background-color: #111e38;
            color: white;
            padding: 20px;
            border-radius: 8px;
            grid-column: span 2;
        }

        .sidebar {
            background-color: #dbe4ff;
            padding: 20px;
            border-radius: 8px;
        }

        .main-content {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
        }

        .footer {
            background-color: #111e38;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            grid-column: span 2;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <div class="header">My Dashboard</div>
        <div class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </div>
        <div class="main-content">Main Area (Cards will come here)</div>
        <div class="footer">Made with CSS Grid</div>
    </div>
</body>

</html>
