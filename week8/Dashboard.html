<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <title>Question 8.3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f4f9;
            padding: 20px;
        }

        /* 8.3: Name areas using grid-template-areas */
        .dashboard-container {
            display: grid;
            grid-template-columns: 220px 1fr;
            grid-template-rows: 140px 1fr auto;
            grid-template-areas:
                "head head"
                "side main"
                "foot foot";
            gap: 20px;
        }

        .header {
            grid-area: head;
            background-color: #111e38;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar {
            grid-area: side;
            background-color: #dbe4ff;
            padding: 20px;
            border-radius: 8px;
        }

        .main-content {
            grid-area: main;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .footer {
            grid-area: foot;
            background-color: #111e38;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <div class="header">My Dashboard</div>
        <div class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </div>
        <div class="main-content">
            <div class="card">Box 1</div>
            <div class="card">Box 2</div>
            <div class="card">Box 3</div>
            <div class="card">Box 4</div>
            <div class="card">Box 5</div>
            <div class="card">Box 6</div>
        </div>
        <div class="footer">Made with CSS Grid</div>
    </div>
</body>

</html>
