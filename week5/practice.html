<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Join the Tech Club to learn, code, and grow.">
    <title>Tech Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-page: #eef2ff;
            --color-text: #172554;
            --color-surface: #ffffff;
            --color-primary: #315bea;
            --color-input-border: #888888;
            --color-border: #cbd5e1;
            --color-shadow: #17255414;
            --spacing-xs: 8px;
            --spacing-input: 6px;
            --spacing-sm: 16px;
            --spacing-md: 20px;
            --spacing-lg: 40px;
            --spacing-xl: 48px;
            --spacing-button-inline: 18px;
            --spacing-shadow-y: 2px;
            --spacing-shadow-blur: 8px;
            --form-label-width: 54px;
            --form-input-max-width: 220px;
            --radius-card: 12px;
            --radius-input: 2px;
            --radius-button: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            font-family: "Lora", Georgia, serif;
            line-height: 1.5;
        }

        body {
            min-height: 100vh;
            max-width: 860px;
            margin: 0 auto;
            padding: var(--spacing-md);
            background-color: var(--color-page);
            color: var(--color-text);
        }

        h1 {
            margin-bottom: var(--spacing-xs);
            font-size: 2.5rem;
            line-height: 1.2;
        }

        .card {
            margin-top: var(--spacing-md);
            padding: var(--spacing-md);
            border-radius: var(--radius-card);
            background-color: var(--color-surface);
            box-shadow: 0 var(--spacing-shadow-y) var(--spacing-shadow-blur) var(--color-shadow);
        }

        #hero {
            padding: var(--spacing-xl) var(--spacing-md);
            border-radius: var(--radius-card);
            background-color: var(--color-primary);
            color: var(--color-surface);
            text-align: center;
        }

        h2 {
            margin-bottom: var(--spacing-sm);
            font-size: 1.65rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: var(--spacing-xs);
        }

        th {
            background-color: var(--color-primary);
            color: var(--color-surface);
        }

        td {
            border-bottom: 1px solid var(--color-border);
        }

        .form-row {
            display: grid;
            grid-template-columns: var(--form-label-width) minmax(0, var(--form-input-max-width));
            align-items: center;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-xs);
        }

        input {
            width: 100%;
            min-width: 0;
            padding: var(--spacing-input);
            border: 1px solid var(--color-input-border);
            border-radius: var(--radius-input);
            font: inherit;
        }

        button {
            padding: var(--spacing-xs) var(--spacing-button-inline);
            border: 0;
            border-radius: var(--radius-button);
            background-color: var(--color-primary);
            color: var(--color-surface);
            font: inherit;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            body {
                padding: var(--spacing-sm);
            }

            #hero {
                padding: var(--spacing-lg) var(--spacing-sm);
            }

            .card {
                padding: var(--spacing-sm);
            }
        }
    </style>
</head>

<body>
    <header id="hero">
        <h1>Tech Club</h1>
        <p>Learn. Code. Grow.</p>
    </header>

    <main>
        <section class="card">
            <h2>Upcoming Events</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">Event</th>
                        <th scope="col">Date</th>
                        <th scope="col">Venue</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>HTML Workshop</td>
                        <td>12 Nov</td>
                        <td>Lab 1</td>
                    </tr>
                    <tr>
                        <td>Hackathon</td>
                        <td>20 Nov</td>
                        <td>Seminar Hall</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>Register</h2>
            <form>
                <div class="form-row">
                    <label for="name">Name:</label>
                    <input id="name" name="name" type="text" placeholder="Your name" required>
                </div>
                <div class="form-row">
                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email" placeholder="you@example.com" required>
                </div>
                <button type="submit">Register</button>
            </form>
        </section>
    </main>
</body>

</html>
