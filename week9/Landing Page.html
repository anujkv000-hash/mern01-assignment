<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderGo Travel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #142342;
        }

        .page {
            width: 100%;
            margin: 0 auto;
        }

        /* Navbar: Flexbox */
        .navbar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            padding: 0.75rem;
            background-color: #10203d;
            color: white;
        }

        .logo {
            margin: 0;
            font-size: 1.1rem;
        }

        .nav-links {
            display: flex;
            gap: 0.75rem;
        }

        .nav-links a {
            color: white;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .hero {
            padding: 1.5rem 0.75rem;
            text-align: center;
            color: white;
            background-color: #315bea;
        }

        .hero h1 {
            max-width: 16rem;
            margin: 0 auto 0.25rem;
            font-size: 1.4rem;
        }

        .hero p {
            margin: 0 0 0.75rem;
            font-size: 0.85rem;
        }

        .hero-image {
            display: block;
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
        }

        /* Features: CSS Grid */
        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.6rem;
            padding: 0.75rem;
            background-color: white;
        }

        .feature {
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            background-color: #eef2ff;
        }

        .feature h2 {
            margin: 0 0 0.2rem;
            font-size: 1rem;
        }

        .feature p {
            margin: 0;
            font-size: 0.85rem;
        }

        /* Tablet: 768px se */
        @media (min-width: 768px) {
            .page {
                max-width: 42rem;
            }

            .navbar {
                flex-direction: row;
                justify-content: space-between;
                padding: 0.75rem 1rem;
            }

            .hero {
                padding: 1.75rem 1rem;
            }

            .features {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Desktop: 1024px se */
        @media (min-width: 1024px) {
            .page {
                max-width: 62rem;
            }

            .hero {
                padding: 2rem;
            }

            .hero h1 {
                max-width: none;
                font-size: 1.8rem;
            }

            .hero-image {
                width: 60%;
                margin: 0 auto;
            }

            .features {
                padding: 1rem 1.25rem;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <nav class="navbar">
            <h2 class="logo">WanderGo</h2>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#trips">Trips</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>

        <section class="hero" id="home">
            <h1>Plan your next trip in minutes</h1>
            <p>Simple, cheap and fun travel plans.</p>
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80"
    alt="Pahadon mein safar">
        </section>

        <section class="features" id="trips">
            <article class="feature">
                <h2>Easy Booking</h2>
                <p>Book in 3 clicks.</p>
            </article>

            <article class="feature">
                <h2>Best Prices</h2>
                <p>We compare for you.</p>
            </article>

            <article class="feature">
                <h2>24x7 Help</h2>
                <p>We are here for you.</p>
            </article>
        </section>
    </main>
</body>

</html>
